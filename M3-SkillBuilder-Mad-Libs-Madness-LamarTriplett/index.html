<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>MadLibs</title>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Delius&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>

  <body>
    <div id="container">
      <form id="form">
      <h1>Mad Libs</h1>
              <h3>Pick Your Words</h3>
        <label for="relative">A Relative:</label>
        <input type="text"
               placeholder="A Relative"
               id="relative">

        <label for="adjective-1">Adjective:</label>
        <input type="text"
               placeholder="Adjective"
               id="adjective-1">

        <label for="adjective-2">Adjective:</label>
        <input type="text"
               placeholder="Adjective"
               id="adjective-2">

        <label for="adjective-3">Adjective:</label>
        <input type="text"
               placeholder="Adjective"
               id="adjective-3">

        <label for="famous_person">A Famous Person:</label>
        <input type="text"
               placeholder="A Famous Person"
               id="famous_person">

        <label for="noun">Noun:</label>
        <input type="text"
               placeholder="Noun"
               id="noun">

        <label for="dessert">A Dessert:</label>
        <input type="text"
               placeholder="A Dessert"
               id="dessert">

        <label for="pet_name">Your Pet's Name:</label>
        <input type="text"
               placeholder="Your Pet's Name"
               id="pet_name">

        <button type="button"
                onclick="generate()">Generate</button>
        <button type="button"
                id="playAgainBtn"
                onclick="playAgain()"
                style="display:none;">Play Again</button>
      </form>
      <div id="output"></div>
    </div>
    
    <script src="script.js"></script>
  </body>
</html>
